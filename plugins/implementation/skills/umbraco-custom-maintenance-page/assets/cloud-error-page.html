<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>We'll be right back</title>
    <!-- Umbraco Cloud Error Page: must be fully self-contained (served via Cloudflare from
         blob storage while the site is down - no external fonts/CSS/JS will load) and under
         20 KB. Upload via the Cloud portal: Error Pages > Upload Error Page. -->
    <style>
        :root{--brand:#1B1B1B;--gray:#6B7280;--light:#F5F5F5;--white:#fff;--accent:#f5c1bc}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--light);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .container{background:var(--white);border-radius:24px;padding:2.5rem;max-width:480px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,0.2);text-align:center}
        h1{color:var(--brand);font-size:1.75rem;font-weight:700;margin-bottom:0.75rem}
        p{color:var(--gray);font-size:1rem;line-height:1.6;margin-bottom:1.5rem}
        .status-badge{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--brand);padding:8px 16px;border-radius:20px;font-size:0.875rem;font-weight:600}
        .spinner{width:14px;height:14px;border:2px solid var(--brand);border-bottom-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="container">
        <h1>We'll be right back</h1>
        <p>We're performing some maintenance on the site. It won't take long — thanks for your patience!</p>
        <div class="status-badge">
            <span class="spinner"></span>
            <span>Checking status&hellip; no need to refresh</span>
        </div>
    </div>
    <script>
        // Cloud does not reload visitors automatically when the site comes back -
        // poll the origin and refresh once it responds normally again.
        setInterval(function () {
            fetch(window.location.origin + '/', { method: 'HEAD', cache: 'no-store' })
                .then(function (r) { if (r.ok && r.status !== 503) window.location.reload(); })
                .catch(function () { /* still down - keep waiting */ });
        }, 5000);
    </script>
</body>
</html>
